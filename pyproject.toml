[project]
name = "torus-kg"
version = "0.4.0"
description = "Stock research memory for Claude Code, Claude Desktop and Codex: equity research, investment theses and SEC filing alerts in a local knowledge graph"
readme = "README.md"
keywords = ["stock-research", "equity-research", "investment-research", "investing", "stocks", "sec-edgar", "knowledge-graph", "claude-code", "mcp"]
license = "Apache-2.0"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.7,<3",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/sekhar14/torus"
Changelog = "https://github.com/sekhar14/torus/blob/main/CHANGELOG.md"
Issues = "https://github.com/sekhar14/torus/issues"

[project.scripts]
torus = "torus.cli:main"
torus-kg = "torus.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not perf'"
markers = [
    "perf: performance tests (run nightly / before release)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
files = ["src/torus"]
plugins = ["pydantic.mypy"]
strict = true
